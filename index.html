<!doctype html><html lang=nl><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Luisterspel – De mooiste vis van de zee</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#e8f8ff;color:#173d67;overflow:hidden;touch-action:none}header{height:86px;padding:10px 14px;background:#fff;border-bottom:3px solid #bde2f1;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{margin:0;font-size:clamp(22px,2.2vw,34px);color:#2862ae}small{color:#39778a}button{background:#fff;border:2px solid #9fd2e4;color:#1d4c84;border-radius:13px;padding:8px 11px;font-weight:700;font-size:14px}#controls{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}main{height:calc(100% - 86px);padding:10px}#stage{position:relative;width:100%;height:100%;border:4px solid #bde2f1;border-radius:22px;overflow:hidden;background:linear-gradient(#e9fbff 0 60%,#fff8dc 60%)}#op{position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:30;background:#fffffff2;border:3px solid #bde2f1;border-radius:18px;padding:8px 10px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:center}#answer{position:absolute;top:80px;left:50%;transform:translateX(-50%);z-index:29;background:#fff;border:2px dashed #9fd2e4;border-radius:14px;padding:9px 14px;font-size:20px;font-weight:700;display:none}#answer.show{display:block}#slots{position:absolute;inset:0;pointer-events:none}.slot{position:absolute;border:4px dashed #2862ae55;border-radius:18px;background:#ffffff55;display:grid;place-items:center;font-size:32px;font-weight:bold;color:#2862ae77}#bank{position:absolute;left:12px;right:12px;bottom:10px;height:175px;background:#ffffffc9;border:3px solid #cbeaf6;border-radius:22px}#bank b{position:absolute;left:16px;top:10px;color:#1686a4;font-size:20px}.card{position:absolute;background:#fff;border:3px solid #2e67b9;border-radius:14px;padding:5px 5px 8px;box-shadow:0 6px 18px #12446825;user-select:none;touch-action:none;z-index:5}.card img{width:100%;display:block;border-radius:9px;pointer-events:none}.lab{text-align:center;font-weight:bold;font-size:14px;margin-top:4px}.drag{transform:scale(1.04)}#status{font-size:13px;color:#39778a}</style><body><header><div><h1>Luisterspel – De mooiste vis van de zee</h1><small>Luister, onthoud en leg de kaartjes van links naar rechts.</small></div><div id=controls><button id=reset>Zet in één rij</button><button id=shuffle>Hussel rij</button><button id=hide>Verberg vakken</button></div></header><main><div id=stage><div id=op><button id=n3>Nieuwe opdracht · 3</button><button id=n4>Nieuwe opdracht · 4</button><button id=speak>🔊 Luister nog eens</button><button id=ans>Toon antwoord</button><span id=status>Kies een opdracht.</span></div><div id=answer></div><div id=slots></div><div id=bank><b>Kaartjes</b></div></div></main><script>const C=[{"n":"vis","d":"https://dummyimage.com/120x150/ffffff/2862ae&text=VIS"},{"n":"octopus","d":"https://dummyimage.com/120x150/ffffff/2862ae&text=OCTOPUS"},{"n":"zeewier","d":"https://dummyimage.com/120x150/ffffff/2862ae&text=ZEEWIER"},{"n":"ster","d":"https://dummyimage.com/120x150/ffffff/2862ae&text=STER"},{"n":"schelp","d":"https://dummyimage.com/120x150/ffffff/2862ae&text=SCHELP"},{"n":"krab","d":"https://dummyimage.com/120x150/ffffff/2862ae&text=KRAB"},{"n":"kwal","d":"https://dummyimage.com/120x150/ffffff/2862ae&text=KWAL"},{"n":"zeepaardje","d":"https://dummyimage.com/120x150/ffffff/2862ae&text=ZEEPAARDJE"},{"n":"parel","d":"https://dummyimage.com/120x150/ffffff/2862ae&text=PAREL"}],S3=[["vis","schelp","krab"],["octopus","kwal","parel"],["zeewier","ster","zeepaardje"],["krab","vis","parel"],["schelp","octopus","ster"],["kwal","zeewier","vis"],["zeepaardje","krab","schelp"],["parel","ster","octopus"],["vis","kwal","zeewier"],["ster","zeepaardje","krab"]],S4=[["vis","octopus","schelp","krab"],["kwal","parel","zeewier","ster"],["zeepaardje","vis","krab","schelp"],["octopus","ster","parel","kwal"],["zeewier","krab","vis","zeepaardje"],["schelp","kwal","octopus","parel"],["ster","vis","zeewier","krab"],["parel","zeepaardje","schelp","octopus"],["krab","kwal","ster","vis"],["zeewier","parel","zeepaardje","schelp"]],stage=document.querySelector('#stage'),slots=document.querySelector('#slots'),answer=document.querySelector('#answer'),status=document.querySelector('#status'),cards=[];let cur=null,z=10,l3=-1,l4=-1;function L(){let r=stage.getBoundingClientRect(),gap=Math.max(4,Math.min(10,r.width*.006)),w=Math.max(62,Math.min(118,Math.floor((r.width-36-8*gap)/9))),h=Math.round(w*1.32),x=(r.width-(9*w+8*gap))/2,y=r.height-165+(165-h)/2+8;return{r,gap,w,h,x,y}}function pos(e,x,y){let r=stage.getBoundingClientRect(),q=e.getBoundingClientRect();e.style.left=Math.max(3,Math.min(x,r.width-q.width-3))+'px';e.style.top=Math.max(3,Math.min(y,r.height-q.height-3))+'px';e.style.zIndex=++z}function row(sh=false){let a=L(),ix=[0,1,2,3,4,5,6,7,8];if(sh)for(let i=8;i;i--){let j=Math.floor(Math.random()*(i+1));[ix[i],ix[j]]=[ix[j],ix[i]]}cards.forEach((e,i)=>{e.style.width=a.w+'px';pos(e,a.x+ix[i]*(a.w+a.gap),a.y)})}function drag(e){let sx,sy,ox,oy;e.onpointerdown=v=>{v.preventDefault();sx=v.clientX;sy=v.clientY;ox=parseFloat(e.style.left)||0;oy=parseFloat(e.style.top)||0;e.setPointerCapture(v.pointerId);e.classList.add('drag')};e.onpointermove=v=>{if(e.hasPointerCapture(v.pointerId))pos(e,ox+v.clientX-sx,oy+v.clientY-sy)};e.onpointerup=v=>{e.classList.remove('drag');try{e.releasePointerCapture(v.pointerId)}catch{};snap(e)}}C.forEach(c=>{let e=document.createElement('div');e.className='card';e.dataset.n=c.n;e.innerHTML=`<img src="${c.d}"><div class=lab>${c.n}</div>`;stage.appendChild(e);cards.push(e);drag(e)});row();function show(n){slots.innerHTML='';let r=stage.getBoundingClientRect(),gap=18,w=Math.min(138,Math.floor((r.width*.75-(n-1)*gap)/n)),h=Math.round(w*1.32),x=(r.width-(n*w+(n-1)*gap))/2,y=Math.min(180,r.height-175-h-30);for(let i=0;i<n;i++){let s=document.createElement('div');s.className='slot';s.style.cssText=`width:${w}px;height:${h}px;left:${x+i*(w+gap)}px;top:${y}px`;s.textContent=i+1;slots.appendChild(s)}}function snap(e){let ss=[...document.querySelectorAll('.slot')];if(!ss.length)return;let er=e.getBoundingClientRect(),ex=er.left+er.width/2,ey=er.top+er.height/2,b,d=1e9;ss.forEach(s=>{let r=s.getBoundingClientRect(),q=Math.hypot(ex-r.left-r.width/2,ey-r.top-r.height/2);if(q<d){d=q;b=s}});if(b&&d<100){let r=b.getBoundingClientRect(),st=stage.getBoundingClientRect();pos(e,r.left-st.left+(r.width-er.width)/2,r.top-st.top+(r.height-er.height)/2)}}function pick(list,n){let last=n==3?l3:l4,i;do i=Math.floor(Math.random()*list.length);while(i==last&&list.length>1);n==3?l3=i:l4=i;cur=list[i];answer.textContent=cur.join(' – ');answer.classList.remove('show');ans.textContent='Toon antwoord';show(n);talk()}function talk(){if(!cur)return;let sp=window.speechSynthesis;if(!sp){status.textContent='Spraak niet ondersteund.';return}sp.cancel();let u=new SpeechSynthesisUtterance(cur.join(', '));u.lang='nl-NL';u.rate=.72;let vs=sp.getVoices(),v=vs.find(x=>x.lang&&x.lang.toLowerCase().startsWith('nl'));if(v)u.voice=v;u.onstart=()=>status.textContent='Luister…';u.onend=()=>status.textContent='Klaar. Leg het rijtje.';u.onerror=()=>status.textContent='Tik op Luister nog eens.';sp.speak(u)}n3.onclick=()=>pick(S3,3);n4.onclick=()=>pick(S4,4);speak.onclick=talk;ans.onclick=()=>{if(!cur)return;answer.classList.toggle('show');ans.textContent=answer.classList.contains('show')?'Verberg antwoord':'Toon antwoord'};reset.onclick=()=>row();shuffle.onclick=()=>row(true);hide.onclick=()=>slots.innerHTML='';onresize=()=>row();</script></body></html>
